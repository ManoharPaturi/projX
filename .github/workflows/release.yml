name: Release

# Push a tag like v1.0.0 (matching `version:` in app/pubspec.yaml) to build
# a signed Play bundle + arm64 APK and attach them to a GitHub Release.
# Signing secrets (docs/release.md): OMR_KEYSTORE_BASE64,
# OMR_KEYSTORE_PASSWORD, OMR_KEY_ALIAS, OMR_KEY_PASSWORD.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME but app/pubspec.yaml says $APP_VERSION"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Android SDK path + modern CMake for the OpenCV hook
        run: |
          sudo mkdir -p /opt/homebrew/share
          sudo ln -sfn "$ANDROID_HOME" /opt/homebrew/share/android-commandlinetools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" > /dev/null
      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OMR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No OMR_KEYSTORE_BASE64 secret — artifacts are debug-signed and NOT uploadable to Play."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "OMR_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get
      - name: Build Play bundle + arm64 APK
        working-directory: app
        env:
          OMR_KEYSTORE_PASSWORD: ${{ secrets.OMR_KEYSTORE_PASSWORD }}
          OMR_KEY_ALIAS: ${{ secrets.OMR_KEY_ALIAS }}
          OMR_KEY_PASSWORD: ${{ secrets.OMR_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --target-platform android-arm64
          flutter build apk --release --target-platform android-arm64
      - name: zipalign -c -P 16
        run: |
          ZIPALIGN=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          "$ZIPALIGN" -c -P 16 -v 4 app/build/app/outputs/flutter-apk/app-release.apk | tail -3
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
